<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDebug AI</title>

<style>
body {
  margin: 0;
  background: #0b1220;
  color: white;
  font-family: Arial;
}

.header {
  padding: 10px;
  background: #111827;
  display: flex;
  justify-content: space-between;
}

.container {
  display: grid;
  grid-template-columns: 250px 1fr 300px;
  height: calc(100vh - 40px);
}

.panel {
  border-right: 1px solid #1f2937;
  padding: 10px;
  overflow-y: auto;
}

.chat {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.messages {
  flex: 1;
  overflow-y: auto;
}

.msg {
  padding: 6px;
  margin-bottom: 6px;
}

.user { background: #2563eb; }
.bot { background: #1e293b; }

.input-box {
  display: flex;
}

input {
  flex: 1;
  padding: 6px;
}

button {
  background: green;
  color: white;
  border: none;
}
</style>
</head>

<body>

<div class="header">
  KDebug AI
  <span id="status">Connecting...</span>
</div>

<div class="container">

  <div class="panel">
    <h3>Alerts</h3>
    <div id="alerts"></div>
  </div>

  <div class="panel chat">
    <div id="chat" class="messages"></div>

    <div class="input-box">
      <input id="msg">
      <button onclick="send()">Send</button>
    </div>
  </div>

  <div class="panel">
    <h3>Details</h3>
    <pre id="details"></pre>
  </div>

</div>

<script>
const SERVER = "http://YOUR_KDEBUG_SVC";

function send() {
  const input = document.getElementById("msg");
  const chat = document.getElementById("chat");

  const text = input.value;
  if (!text) return;

  chat.innerHTML += "<div class='msg user'>" + text + "</div>";
  input.value = "";

  fetch(SERVER + "/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ message: text })
  })
  .then(r => r.json())
  .then(d => {
    chat.innerHTML += "<div class='msg bot'>" + d.reply + "</div>";
  });
}

setInterval(() => {
  fetch(SERVER + "/events")
  .then(r => r.json())
  .then(events => {
    const box = document.getElementById("alerts");
    box.innerHTML = "";

    events.slice(-5).forEach(e => {
      const el = document.createElement("div");
      el.innerText = e.name + " → " + e.reason;
      el.onclick = () => {
        document.getElementById("details").innerText =
          JSON.stringify(e, null, 2);
      };
      box.appendChild(el);
    });

    document.getElementById("status").innerText = "Connected";
  });
}, 3000);
</script>

</body>
</html>
