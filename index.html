<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDebug AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: #e2e8f0;
}

/* HEADER */
.header {
  padding: 12px;
  background: #111827;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 300px;
  height: calc(100vh - 50px);
}

/* PANELS */
.panel {
  border-right: 1px solid #1f2937;
  padding: 10px;
  overflow-y: auto;
}

.panel:last-child {
  border-right: none;
}

.panel h3 {
  margin-top: 0;
  font-size: 14px;
  color: #94a3b8;
}

/* ALERT */
.alert {
  background: #1e293b;
  padding: 8px;
  margin-bottom: 8px;
  border-radius: 6px;
  cursor: pointer;
}

.alert:hover {
  background: #334155;
}

/* CHAT */
.chat {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.messages {
  flex: 1;
  overflow-y: auto;
}

.msg {
  padding: 8px;
  margin-bottom: 6px;
  border-radius: 6px;
  max-width: 80%;
}

.user {
  background: #2563eb;
  align-self: flex-end;
}

.bot {
  background: #1e293b;
}

/* INPUT */
.input-box {
  display: flex;
  margin-top: 10px;
}

input {
  flex: 1;
  padding: 8px;
  background: #111827;
  border: 1px solid #1f2937;
  color: white;
}

button {
  padding: 8px 12px;
  background: #22c55e;
  border: none;
  cursor: pointer;
}

/* MOBILE */
@media (max-width: 900px) {
  .container {
    grid-template-columns: 1fr;
  }

  .panel {
    border-right: none;
    border-bottom: 1px solid #1f2937;
  }
}
</style>
</head>

<body>

<div class="header">
  ⚡ KDebug AI
  <span id="status" style="color: orange;">🟡 Connecting...</span>
</div>

<div class="container">

  <!-- ALERTS -->
  <div class="panel">
    <h3>🚨 Alerts</h3>
    <div id="alerts"></div>
  </div>

  <!-- CHAT -->
  <div class="panel chat">
    <h3>🤖 SRE Assistant</h3>
    <div id="chat" class="messages"></div>

    <div class="input-box">
      <input id="msg" placeholder="Ask SRE AI..." />
      <button onclick="send()">Send</button>
    </div>
  </div>

  <!-- DETAILS -->
  <div class="panel">
    <h3>🔍 Resource Details</h3>
    <pre id="details"></pre>
  </div>

</div>

<script>
const SERVER = "http://YOUR_KDEBUG_SVC";

/* -----------------------------
   💾 LOAD CHAT
----------------------------- */
window.onload = () => {
  const saved = localStorage.getItem("kdebug_chat");
  if (saved) {
    document.getElementById("chat").innerHTML = saved;
  }
};

/* -----------------------------
   💾 SAVE CHAT
----------------------------- */
function saveChat() {
  const chat = document.getElementById("chat").innerHTML;
  localStorage.setItem("kdebug_chat", chat);
}

/* -----------------------------
   💬 SEND MESSAGE
----------------------------- */
function send() {
  const input = document.getElementById("msg");
  const chat = document.getElementById("chat");

  const text = input.value.trim();
  if (!text) return;

  chat.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = "";
  saveChat();

  fetch(SERVER + "/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ session: "ui", message: text })
  })
  .then(res => res.json())
  .then(data => {
    chat.innerHTML += `<div class="msg bot">${data.reply}</div>`;
    chat.scrollTop = chat.scrollHeight;
    saveChat();
  })
  .catch(() => {
    chat.innerHTML += `<div class="msg bot">❌ Backend unreachable</div>`;
    saveChat();
  });
}

/* ENTER KEY */
document.getElementById("msg").addEventListener("keypress", function(e) {
  if (e.key === "Enter") send();
});

/* -----------------------------
   🔔 STATUS + EVENTS
----------------------------- */
setInterval(() => {
  fetch(SERVER + "/events")
  .then(r => {
    if (!r.ok) throw new Error("backend_down");
    return r.json();
  })
  .then(events => {
    const box = document.getElementById("alerts");
    box.innerHTML = "";

    events.slice(-5).forEach(e => {
      const el = document.createElement("div");
      el.className = "alert";
      el.innerText = `${e.namespace}/${e.name} → ${e.reason}`;

      el.onclick = () => {
        document.getElementById("details").innerText =
          JSON.stringify(e, null, 2);
      };

      box.appendChild(el);
    });

    // 🟢 SUCCESS
    const status = document.getElementById("status");
    status.innerText = "🟢 Cluster: Connected";
    status.style.color = "lightgreen";
  })
  .catch((err) => {
    const status = document.getElementById("status");

    // 🔴 Backend unreachable (wrong URL / svc not exposed)
    status.innerText = "🔴 Backend Unreachable";
    status.style.color = "red";
  });

}, 3000);
</script>

</body>
</html>
