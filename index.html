<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDebug AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: #e2e8f0;
}

/* HEADER */
.header {
  padding: 12px;
  background: #111827;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 300px;
  height: calc(100vh - 50px);
}

/* PANELS */
.panel {
  border-right: 1px solid #1f2937;
  padding: 10px;
  overflow-y: auto;
}

.panel:last-child {
  border-right: none;
}

.panel h3 {
  margin-top: 0;
  font-size: 14px;
  color: #94a3b8;
}

/* ALERT */
.alert {
  background: #1e293b;
  padding: 8px;
  margin-bottom: 8px;
  border-radius: 6px;
  cursor: pointer;
}

.alert:hover {
  background: #334155;
}

/* CHAT LIST */
.chat-list {
  margin-top: 10px;
}

.chat-item {
  padding: 6px;
  background: #1e293b;
  margin-bottom: 5px;
  border-radius: 6px;
  cursor: pointer;
}

.chat-item:hover {
  background: #334155;
}

/* CHAT */
.chat {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

/* MESSAGE STYLES */
.msg {
  max-width: 70%;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 10px;
  word-wrap: break-word;
}

.user {
  background: #2563eb;
  margin-left: auto;
  text-align: right;
}

.bot {
  background: #1e293b;
  margin-right: auto;
}

/* INPUT */
.input-box {
  display: flex;
  margin-top: 10px;
}

input {
  flex: 1;
  padding: 10px;
  background: #111827;
  border: 1px solid #1f2937;
  color: white;
  border-radius: 6px;
}

button {
  padding: 10px 14px;
  background: #22c55e;
  border: none;
  cursor: pointer;
  margin-left: 5px;
  border-radius: 6px;
}

.new-chat {
  width: 100%;
  margin-top: 10px;
  background: #2563eb;
}

/* MOBILE */
@media (max-width: 900px) {
  .container {
    grid-template-columns: 1fr;
  }

  .panel {
    border-right: none;
    border-bottom: 1px solid #1f2937;
  }
}
</style>
</head>

<body>

<div class="header">
  ⚡ KDebug AI
  <span id="status">🟡 Cluster: Checking...</span>
</div>

<div class="container">

  <!-- LEFT PANEL -->
  <div class="panel">
    <h3>🚨 Alerts</h3>
    <div id="alerts"></div>

    <button class="new-chat" onclick="createChat()">➕ New Chat</button>

    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- CHAT -->
  <div class="panel chat">
    <h3>🤖 SRE Assistant</h3>
    <div id="chat" class="messages"></div>

    <div class="input-box">
      <input id="msg" placeholder="Ask SRE AI..." />
      <button onclick="send()">Send</button>
    </div>
  </div>

  <!-- DETAILS -->
  <div class="panel">
    <h3>🔍 Resource Details</h3>
    <pre id="details"></pre>
  </div>

</div>

<script>
const SERVER = "http://YOUR_KDEBUG_SVC";

/* -----------------------------
   🧠 CHAT MANAGEMENT
----------------------------- */
let currentChat = "chat-1";

function loadChats() {
  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");

  const list = document.getElementById("chatList");
  list.innerHTML = "";

  Object.keys(chats).forEach(id => {
    const el = document.createElement("div");
    el.className = "chat-item";
    el.innerText = id;

    el.onclick = () => {
      currentChat = id;
      renderChat();
    };

    list.appendChild(el);
  });
}

function createChat() {
  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
  const id = "chat-" + (Object.keys(chats).length + 1);

  chats[id] = [];
  localStorage.setItem("kdebug_chats", JSON.stringify(chats));

  currentChat = id;
  loadChats();
  renderChat();
}

function renderChat() {
  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
  const chatBox = document.getElementById("chat");

  chatBox.innerHTML = "";

  (chats[currentChat] || []).forEach(m => {
    chatBox.innerHTML += `<div class="msg ${m.type}">${m.text}</div>`;
  });
}

/* -----------------------------
   💬 SEND MESSAGE
----------------------------- */
function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");

  chats[currentChat].push({ type: "user", text });

  input.value = "";
  localStorage.setItem("kdebug_chats", JSON.stringify(chats));
  renderChat();

  fetch(SERVER + "/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ session: currentChat, message: text })
  })
  .then(res => res.json())
  .then(data => {
    const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");

    chats[currentChat].push({ type: "bot", text: data.reply });

    localStorage.setItem("kdebug_chats", JSON.stringify(chats));
    renderChat();
  })
  .catch(() => {
    const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");

    chats[currentChat].push({ type: "bot", text: "❌ Server unreachable" });

    localStorage.setItem("kdebug_chats", JSON.stringify(chats));
    renderChat();
  });
}

/* ENTER KEY */
document.getElementById("msg").addEventListener("keypress", e => {
  if (e.key === "Enter") send();
});

/* -----------------------------
   🔔 EVENTS + STATUS
----------------------------- */
setInterval(() => {
  if (SERVER.includes("YOUR_KDEBUG_SVC")) {
    document.getElementById("status").innerText = "🟡 Not Configured";
    return;
  }

  fetch(SERVER + "/events")
  .then(r => {
    if (!r.ok) throw new Error();
    return r.json();
  })
  .then(events => {
    const box = document.getElementById("alerts");
    box.innerHTML = "";

    events.slice(-5).forEach(e => {
      const el = document.createElement("div");
      el.className = "alert";
      el.innerText = `${e.namespace}/${e.name} → ${e.reason}`;

      el.onclick = () => {
        document.getElementById("details").innerText =
          JSON.stringify(e, null, 2);
      };

      box.appendChild(el);
    });

    const status = document.getElementById("status");
    status.innerText = "🟢 Cluster Connected";
  })
  .catch(() => {
    const status = document.getElementById("status");
    status.innerText = "🔴 Cluster Disconnected";
  });
}, 3000);

/* INIT */
window.onload = () => {
  if (!localStorage.getItem("kdebug_chats")) {
    localStorage.setItem("kdebug_chats", JSON.stringify({ "chat-1": [] }));
  }

  loadChats();
  renderChat();
};
</script>

</body>
</html>
