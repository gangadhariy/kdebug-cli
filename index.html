<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDebug AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: #e2e8f0;
}

/* HEADER */
.header {
  padding: 12px;
  background: #111827;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 300px;
  height: calc(100vh - 50px);
}

/* LEFT PANEL */
.left-panel {
  display: flex;
  flex-direction: column;
  border-right: 1px solid #1f2937;
}

/* CHAT LIST */
.chat-section {
  padding: 10px;
  border-bottom: 1px solid #1f2937;
}

.chat-list {
  max-height: 200px;
  overflow-y: auto;
}

.chat-item {
  display: flex;
  justify-content: space-between;
  padding: 6px;
  background: #1e293b;
  margin-bottom: 5px;
  border-radius: 6px;
  cursor: pointer;
}

.chat-item:hover {
  background: #334155;
}

.delete-btn {
  display: none;
  color: #ef4444;
  cursor: pointer;
}

.chat-item:hover .delete-btn {
  display: inline;
}

.new-chat {
  width: 100%;
  margin-bottom: 10px;
  background: #2563eb;
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* ALERTS */
.alert-section {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.alert {
  background: #1e293b;
  padding: 8px;
  margin-bottom: 8px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
}

.alert button {
  background: transparent;
  color: red;
  border: none;
  cursor: pointer;
}

/* CHAT PANEL */
.chat-panel {
  display: flex;
  flex-direction: column;
  padding: 10px;
  height: 100%;
  overflow: hidden;
}

.messages {
  flex: 1;
  overflow-y: auto;
}

/* MESSAGE */
.msg {
  max-width: 70%;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 10px;
  white-space: pre-wrap;
  font-family: monospace;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

.bot {
  background: #1e293b;
  margin-right: auto;
}

/* INPUT */
.input-box {
  display: flex;
  margin-top: 10px;
  position: sticky;
  bottom: 0;
  background: #0b1220;
}

input {
  flex: 1;
  padding: 10px;
  background: #111827;
  border: 1px solid #1f2937;
  color: white;
  border-radius: 6px;
}

button {
  padding: 10px;
  margin-left: 5px;
  background: #22c55e;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* DETAILS */
.details-panel {
  border-left: 1px solid #1f2937;
  padding: 10px;
  overflow-y: auto;
}

/* MOBILE */
@media (max-width: 900px) {
  .container {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  ⚡ KDebug AI
  <span id="status">🟡 Checking...</span>
</div>

<div class="container">

  <!-- LEFT -->
  <div class="left-panel">

    <div class="chat-section">
      <button class="new-chat" onclick="createChat()">➕ New Chat</button>
      <div id="chatList" class="chat-list"></div>
    </div>

    <div class="alert-section">
      <h4>🚨 Alerts</h4>
      <div id="alerts"></div>
    </div>

  </div>

  <!-- CHAT -->
  <div class="chat-panel">
    <h3>🤖 SRE Assistant</h3>

    <div id="chat" class="messages"></div>

    <div class="input-box">
      <input id="msg" placeholder="Ask SRE AI..." />
      <button onclick="send()">Send</button>
    </div>
  </div>

  <!-- DETAILS -->
  <div class="details-panel">
    <h3>🔍 Resource Details</h3>
    <pre id="details"></pre>
  </div>

</div>

<script>
const SERVER = window.location.origin;
let currentChat = "chat-1";

/* FORMAT OUTPUT */
function formatMessage(text) {
  return text;
}

/* LOAD CHAT LIST */
function loadChats() {
  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  Object.keys(chats).forEach(id => {
    const el = document.createElement("div");
    el.className = "chat-item";

    el.innerHTML = `
      <span>${id}</span>
      <span class="delete-btn" onclick="deleteChat(event,'${id}')">🗑</span>
    `;

    el.onclick = () => {
      currentChat = id;
      renderChat();
    };

    list.appendChild(el);
  });
}

/* CREATE CHAT */
function createChat() {
  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
  const id = "chat-" + (Object.keys(chats).length + 1);
  chats[id] = [];
  localStorage.setItem("kdebug_chats", JSON.stringify(chats));

  currentChat = id;
  loadChats();
  renderChat();
}

/* DELETE CHAT */
function deleteChat(e, id) {
  e.stopPropagation();
  let chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");

  if (Object.keys(chats).length === 1) return alert("Cannot delete last chat");

  delete chats[id];
  localStorage.setItem("kdebug_chats", JSON.stringify(chats));

  currentChat = Object.keys(chats)[0];
  loadChats();
  renderChat();
}

/* RENDER CHAT */
function renderChat() {
  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
  const chatBox = document.getElementById("chat");

  const isAtBottom =
    chatBox.scrollHeight - chatBox.scrollTop <= chatBox.clientHeight + 50;

  chatBox.innerHTML = "";

  (chats[currentChat] || []).forEach(m => {
    chatBox.innerHTML += `<div class="msg ${m.type}">${formatMessage(m.text)}</div>`;
  });

  if (isAtBottom) {
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}

/* SEND */
function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");

  chats[currentChat].push({ type: "user", text });
  input.value = "";
  localStorage.setItem("kdebug_chats", JSON.stringify(chats));
  renderChat();

  fetch(SERVER + "/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ session: currentChat, message: text })
  })
  .then(res => res.json())
  .then(data => {
    const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
    chats[currentChat].push({ type: "bot", text: data.reply });
    localStorage.setItem("kdebug_chats", JSON.stringify(chats));
    renderChat();
  })
  .catch(() => {
    const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
    chats[currentChat].push({ type: "bot", text: "❌ Server unreachable" });
    localStorage.setItem("kdebug_chats", JSON.stringify(chats));
    renderChat();
  });
}

/* ENTER KEY */
document.getElementById("msg").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    send();
  }
});

/* EVENTS */
setInterval(() => {
  fetch(SERVER + "/events")
  .then(r => r.json())
  .then(events => {
    const box = document.getElementById("alerts");
    box.innerHTML = "";

    events.slice(-5).forEach(e => {
      const el = document.createElement("div");
      el.className = "alert";

      el.innerHTML = `
        <span>${e.namespace}/${e.name} → ${e.reason}</span>
        <button onclick="this.parentElement.remove()">✖</button>
      `;

      el.onclick = () => {
        document.getElementById("details").innerText =
          JSON.stringify(e, null, 2);
      };

      box.appendChild(el);
    });

    document.getElementById("status").innerText = "🟢 Connected";
  })
  .catch(() => {
    document.getElementById("status").innerText = "🔴 Disconnected";
  });
}, 3000);

/* INIT */
window.onload = () => {
  if (!localStorage.getItem("kdebug_chats")) {
    localStorage.setItem("kdebug_chats", JSON.stringify({ "chat-1": [] }));
  }

  loadChats();
  renderChat();
};
</script>

</body>
</html>
