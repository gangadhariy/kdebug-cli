<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDebug AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #eef2ff, #e5e7eb);
  color: #111827;
}

/* HEADER */
.header {
  padding: 14px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #d1d5db;
  display: flex;
  justify-content: space-between;
  font-weight: 600;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: calc(100vh - 55px);
  overflow: hidden; /* 🔥 FIX */
}

/* PANELS */
.left-panel, .chat-panel, .details-panel {
  backdrop-filter: blur(10px);
}

/* LEFT */
.left-panel {
  display: flex;
  flex-direction: column;
  border-right: 1px solid #d1d5db;
}

/* CHAT LIST */
.chat-section {
  padding: 10px;
  border-bottom: 1px solid #d1d5db;
}

.new-chat {
  width: 100%;
  background: linear-gradient(135deg, #22c55e, #4ade80);
  padding: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
}

.chat-list {
  max-height: 200px;
  overflow-y: auto;
  margin-top: 10px;
}

.chat-item {
  display: flex;
  justify-content: space-between;
  padding: 6px;
  background: rgba(255,255,255,0.7);
  margin-bottom: 5px;
  border-radius: 8px;
  cursor: pointer;
}

.delete-btn {
  display: none;
  color: red;
}

.chat-item:hover .delete-btn {
  display: inline;
}

/* ALERTS */
.alert-section {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.alert {
  background: white;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 10px;
  border-left: 4px solid orange;
  display: flex;
  justify-content: space-between;
  cursor: pointer;
}

.alert button {
  background: none;
  border: none;
  color: red;
  cursor: pointer;
}

/* CHAT PANEL */
.chat-panel {
  display: flex;
  flex-direction: column;
  padding: 10px;
  height: 100%;
  overflow: hidden; /* 🔥 FIX */
}

/* MESSAGES */
.messages {
  flex: 1;
  overflow-y: auto;
  min-height: 0; /* 🔥 FIX */
  scroll-behavior: smooth;
  padding-right: 5px;
}

/* SCROLLBAR */
.messages::-webkit-scrollbar {
  width: 6px;
}
.messages::-webkit-scrollbar-thumb {
  background: #9ca3af;
  border-radius: 10px;
}

/* MSG */
.msg {
  max-width: 75%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 12px;
  font-size: 13px;
}

.user {
  background: linear-gradient(135deg, #6366f1, #3b82f6);
  color: white;
  margin-left: auto;
}

.bot {
  background: white;
  border: 1px solid #d1d5db;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

td, th {
  padding: 6px;
  border-bottom: 1px solid #e5e7eb;
}

th {
  color: #4f46e5;
  text-align: left;
}

/* INPUT */
.input-box {
  display: flex;
  margin-top: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
}

button {
  margin-left: 5px;
  padding: 10px;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: white;
}

/* DETAILS */
.details-panel {
  border-left: 1px solid #d1d5db;
  padding: 10px;
  overflow-y: auto;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="header">
  ⚡ KDebug AI
  <span id="status">🟡 Checking...</span>
</div>

<div class="container">

<div class="left-panel">
  <div class="chat-section">
    <button class="new-chat" onclick="createChat()">➕ New Chat</button>
    <div id="chatList" class="chat-list"></div>
  </div>

  <div class="alert-section">
    <h4>🚨 Alerts</h4>
    <div id="alerts"></div>
  </div>
</div>

<div class="chat-panel">
  <h3>🤖 SRE Assistant</h3>
  <div id="chat" class="messages"></div>

  <div class="input-box">
    <input id="msg" placeholder="Ask SRE AI..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<div class="details-panel">
  <h3>🔍 Resource Details</h3>
  <pre id="details"></pre>
</div>

</div>

<script>
const SERVER = window.location.origin;
let currentChat = "chat-1";

/* FORMAT OUTPUT */
function formatMessage(text) {
  const lines = text.trim().split("\n");

  if (lines.length > 1 && lines[0].includes("NAME")) {
    const rows = lines.map(line => line.trim().split(/\s{2,}/));

    let html = "<table>";
    rows.forEach((row, i) => {
      html += "<tr>";
      row.forEach(col => {
        html += i === 0 ? `<th>${col}</th>` : `<td>${col}</td>`;
      });
      html += "</tr>";
    });
    html += "</table>";
    return html;
  }

  return `<pre>${text}</pre>`;
}

/* CHAT */
function loadChats() {
  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  Object.keys(chats).forEach(id => {
    const el = document.createElement("div");
    el.className = "chat-item";

    el.innerHTML = `
      <span>${id}</span>
      <span class="delete-btn" onclick="deleteChat(event,'${id}')">🗑</span>
    `;

    el.onclick = () => {
      currentChat = id;
      renderChat();
    };

    list.appendChild(el);
  });
}

function createChat() {
  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
  const id = "chat-" + (Object.keys(chats).length + 1);
  chats[id] = [];
  localStorage.setItem("kdebug_chats", JSON.stringify(chats));
  currentChat = id;
  loadChats();
  renderChat();
}

function deleteChat(e, id) {
  e.stopPropagation();
  let chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");

  if (Object.keys(chats).length === 1) return alert("Cannot delete last chat");

  delete chats[id];
  localStorage.setItem("kdebug_chats", JSON.stringify(chats));
  currentChat = Object.keys(chats)[0];
  loadChats();
  renderChat();
}

/* SCROLL FIX */
function renderChat() {
  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
  const chatBox = document.getElementById("chat");

  const atBottom =
    chatBox.scrollHeight - chatBox.scrollTop <= chatBox.clientHeight + 50;

  chatBox.innerHTML = "";

  (chats[currentChat] || []).forEach(m => {
    chatBox.innerHTML += `<div class="msg ${m.type}">${formatMessage(m.text)}</div>`;
  });

  if (atBottom) {
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}

/* SEND */
function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");

  chats[currentChat].push({ type: "user", text });
  input.value = "";
  localStorage.setItem("kdebug_chats", JSON.stringify(chats));
  renderChat();

  fetch(SERVER + "/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ session: currentChat, message: text })
  })
  .then(res => res.json())
  .then(data => {
    const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
    chats[currentChat].push({ type: "bot", text: data.reply });
    localStorage.setItem("kdebug_chats", JSON.stringify(chats));
    renderChat();
  })
  .catch(() => {
    const chats = JSON.parse(localStorage.getItem("kdebug_chats") || "{}");
    chats[currentChat].push({ type: "bot", text: "❌ Server unreachable" });
    localStorage.setItem("kdebug_chats", JSON.stringify(chats));
    renderChat();
  });
}

/* ENTER */
document.getElementById("msg").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    send();
  }
});

/* EVENTS */
setInterval(() => {
  fetch(SERVER + "/events")
  .then(r => r.json())
  .then(events => {
    const box = document.getElementById("alerts");
    box.innerHTML = "";

    events.slice(-5).forEach(e => {
      const el = document.createElement("div");
      el.className = "alert";

      el.innerHTML = `
        <span>${e.namespace}/${e.name} → ${e.reason}</span>
        <button onclick="event.stopPropagation(); this.parentElement.remove()">✖</button>
      `;

      el.onclick = () => {
        document.getElementById("details").innerText =
          JSON.stringify(e, null, 2);
      };

      box.appendChild(el);
    });

    document.getElementById("status").innerText = "🟢 Connected";
  })
  .catch(() => {
    document.getElementById("status").innerText = "🔴 Disconnected";
  });
}, 3000);

/* INIT */
window.onload = () => {
  if (!localStorage.getItem("kdebug_chats")) {
    localStorage.setItem("kdebug_chats", JSON.stringify({ "chat-1": [] }));
  }
  loadChats();
  renderChat();
};
</script>

</body>
</html>
